# Cloudflare Worker — API + static hosting for shop.choirulhaq.com
#
# Local dev works out of the box: `wrangler dev` spins up local D1 (SQLite)
# and KV backed by .wrangler/state — the placeholder IDs below are only used
# against the real Cloudflare API.
#
name = "shop-worker"
main = "src/index.ts"
compatibility_date = "2026-10-15"

# D1 — products, orders, admin users, sessions
[[d1_databases]]
binding = "DB"
database_name = "shop-db"
database_id = "aebe9961-59ca-4000-a6c0-b89aab1cee3d"

# KV — cart state (cart:<cartId> -> JSON)
[[kv_namespaces]]
binding = "CART_KV"
id = "574020d858b54e4489ae7dd944e67e76"

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://shop.choirulhaq.com"

# Custom domain — set via dashboard (Workers & Pages → shop-worker → Custom domains)

# Astro build output — served for every non-API route
[assets]
binding = "ASSETS"
directory = "../frontend/dist"
